plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.discount'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.discount"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Android基本ライブラリ
    implementation 'androidx.core:core-ktx:1.12.0'

    // XML + 標準View用
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
